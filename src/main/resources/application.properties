spring.application.name=mspedido-api-msql

server.port=8081
spring.datasource.url=jdbc:mysql://localhost:3306/mspedidoapidb?createDatabaseIfNotExist=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=root
spring.datasource.password=root

# tava escrito "defineZone" errado, o certo é "defaultZone" - o eureka client nunca
# lia essa url de verdade, usava o valor padrão do spring cloud que por coincidência
# é o mesmo endereço, então mascarava o erro
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

produto.service.name=produto-api-mysql

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
